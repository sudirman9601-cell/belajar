<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
    radial-gradient(circle at top left,#2563eb,#0f172a 50%),
    radial-gradient(circle at bottom right,#06b6d4,#020617 50%);
    padding:20px;
}

.card{
    width:100%;
    max-width:450px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.15);
    border-radius:28px;
    padding:35px;
    text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,.35);
    animation:float 4s ease-in-out infinite;
}

@keyframes float{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-8px);}
}

.profile{
    width:120px;
    height:120px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid rgba(255,255,255,.2);
    margin-bottom:20px;
}

h1{
    color:#fff;
    font-size:32px;
    margin-bottom:8px;
}

.tagline{
    color:#cbd5e1;
    font-size:15px;
    margin-bottom:25px;
}

.bio{
    color:#e2e8f0;
    font-size:14px;
    line-height:1.7;
    margin-bottom:30px;
}

.links{
    display:flex;
    flex-direction:column;
    gap:14px;
}

.link-btn{
    text-decoration:none;
    color:white;
    padding:16px;
    border-radius:16px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.1);
    transition:.3s;
    font-weight:600;
}

.link-btn:hover{
    transform:translateY(-4px) scale(1.02);
    background:rgba(255,255,255,.18);
}

.footer{
    margin-top:25px;
    color:#94a3b8;
    font-size:12px;
}
</style>
